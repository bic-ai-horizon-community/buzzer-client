<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="teal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="#0f172a" rx="12"/>
  
  <!-- Horizon line with teal -->
  <line x1="8" y1="40" x2="56" y2="40" stroke="url(#teal-gradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Trophy cup body -->
  <g>
    <!-- Cup handles -->
    <path d="M 18 32 Q 14 28 14 20" stroke="url(#gold-gradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 46 32 Q 50 28 50 20" stroke="url(#gold-gradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Trophy body -->
    <ellipse cx="32" cy="28" rx="14" ry="10" fill="url(#gold-gradient)"/>
    
    <!-- Trophy stem -->
    <rect x="30" y="38" width="4" height="12" fill="url(#gold-gradient)"/>
    
    <!-- Trophy base -->
    <ellipse cx="32" cy="52" rx="12" ry="4" fill="url(#gold-gradient)"/>
  </g>
  
  <!-- Rising stars/particles above trophy -->
  <circle cx="20" cy="16" r="1.5" fill="url(#teal-gradient)" opacity="0.8"/>
  <circle cx="32" cy="12" r="2" fill="url(#teal-gradient)" opacity="0.9"/>
  <circle cx="44" cy="18" r="1.5" fill="url(#teal-gradient)" opacity="0.7"/>
  
  <!-- Glow effect -->
  <circle cx="32" cy="28" r="18" fill="none" stroke="url(#teal-gradient)" stroke-width="0.5" opacity="0.4"/>
  <circle cx="32" cy="28" r="20" fill="none" stroke="url(#teal-gradient)" stroke-width="0.3" opacity="0.2"/>
</svg>